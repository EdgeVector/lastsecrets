name: LastSecrets schema values and latency
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lastsecrets-values-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  # Both apps use the latest daemon.
  # The old app is the PR base, or the previous main on a push. A manual run compares HEAD with itself.
  APP_BEFORE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
  APP_AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # The daemon reads this value and uses the DEV Schema Service.
  ENVIRONMENT: dev
jobs:
  compare:
    name: Actual CLI fresh-home latency
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.APP_AFTER }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.APP_BEFORE }}
          path: baseline
          persist-credentials: false
      - name: Fetch the latest lastdb nightly
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh release list -R EdgeVector/lastdb --exclude-drafts --limit 30 \
            --json tagName,publishedAt --jq '[.[] | select(.tagName | startswith("nightly-"))] | sort_by(.publishedAt) | last | .tagName')"
          test -n "$tag" && test "$tag" != null
          before_tag="$tag"
          for label in before after; do
            selected="$tag"
            if [ "$label" = before ]; then selected="$before_tag"; fi
            dir="$RUNNER_TEMP/lastdb-$label"
            mkdir "$dir"
            gh release download "$selected" -R EdgeVector/lastdb -D "$dir" \
              -p 'lastdb-x86_64-unknown-linux-gnu.tar.gz' -p 'lastdb-x86_64-unknown-linux-gnu.manifest.json' -p SHA256SUMS.txt
            (cd "$dir" && grep ' lastdb-x86_64-unknown-linux-gnu.tar.gz$' SHA256SUMS.txt | sha256sum -c -)
            tar -xzf "$dir/lastdb-x86_64-unknown-linux-gnu.tar.gz" -C "$dir"
            manifest="$dir/lastdb-x86_64-unknown-linux-gnu.manifest.json"
            want="$(jq -r '.binaries[] | select(.name == "lastdbd") | .sha256' "$manifest")"
            test "$(sha256sum "$dir/lastdbd" | cut -d' ' -f1)" = "$want"
            oid="$(jq -r .source_git_oid "$manifest")"
            prefix=""
            if [ "$label" = before ]; then prefix=before_; fi
            printf '%stag=%s\n%soid=%s\n%slastdbd=%s\n' "$prefix" "$selected" "$prefix" "$oid" "$prefix" "$dir/lastdbd" >> "$GITHUB_OUTPUT"
            printf 'Daemon %s: %s at %s, SHA-256 %s\n' "$label" "$selected" "$oid" "$want" >> "$GITHUB_STEP_SUMMARY"
          done
      # The benchmark helpers (node.py, cleanup.py, artifact.py) match the nightly daemon source.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: EdgeVector/lastdb
          ref: ${{ steps.nightly.outputs.oid }}
          path: lastdb
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Require the actual source revisions
        env:
          DAEMON_TAG: ${{ steps.nightly.outputs.tag }}
          DAEMON_REVISION: ${{ steps.nightly.outputs.oid }}
          BEFORE_TAG: ${{ steps.nightly.outputs.before_tag }}
          BEFORE_REVISION: ${{ steps.nightly.outputs.before_oid }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$APP_AFTER"
          test "$(git -C baseline rev-parse HEAD)" = "$APP_BEFORE"
          test "$(git -C lastdb rev-parse HEAD)" = "$DAEMON_REVISION"
          mkdir "$RUNNER_TEMP/lastsecrets-revisions"
          printf 'App before: %s\nApp after: %s\nDaemon before: %s at %s\nDaemon after: %s at %s\n' \
            "$APP_BEFORE" "$APP_AFTER" "$BEFORE_TAG" "$BEFORE_REVISION" "$DAEMON_TAG" "$DAEMON_REVISION" \
            > "$RUNNER_TEMP/lastsecrets-revisions/revisions.txt"
      - name: Build the two actual CLI releases
        env:
          DAEMON: ${{ steps.nightly.outputs.lastdbd }}
          BEFORE_DAEMON: ${{ steps.nightly.outputs.before_lastdbd }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/lastsecrets-binaries"
          cp "$DAEMON" "$RUNNER_TEMP/lastsecrets-binaries/daemon"
          cp "$BEFORE_DAEMON" "$RUNNER_TEMP/lastsecrets-binaries/before-daemon"
          for label in baseline candidate; do
            cd "$GITHUB_WORKSPACE/$label"
            bun install --frozen-lockfile
            bun build src/cli.ts --compile --outfile "$RUNNER_TEMP/lastsecrets-binaries/$label"
          done
          cd "$RUNNER_TEMP/lastsecrets-binaries"
          sha256sum daemon before-daemon baseline candidate > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Compare normal app operations on fresh homes
        id: operations
        env:
          DAEMON_TAG: ${{ steps.nightly.outputs.tag }}
          DAEMON_REVISION: ${{ steps.nightly.outputs.oid }}
          BEFORE_TAG: ${{ steps.nightly.outputs.before_tag }}
          BEFORE_REVISION: ${{ steps.nightly.outputs.before_oid }}
        run: |
          python3 candidate/scripts/schema-values-latency.py \
            --baseline "$RUNNER_TEMP/lastsecrets-binaries/baseline" --baseline-revision "$APP_BEFORE" \
            --candidate "$RUNNER_TEMP/lastsecrets-binaries/candidate" --candidate-revision "$APP_AFTER" \
            --daemon "$RUNNER_TEMP/lastsecrets-binaries/daemon" --daemon-revision "$DAEMON_REVISION" --daemon-tag "$DAEMON_TAG" \
            --before-daemon "$RUNNER_TEMP/lastsecrets-binaries/before-daemon" --before-revision "$BEFORE_REVISION" --before-tag "$BEFORE_TAG" \
            --lastdb-source "$GITHUB_WORKSPACE/lastdb" --records 64 \
            --output "$RUNNER_TEMP/lastsecrets-results"
      - name: Check retained output for generated value bytes
        if: ${{ always() && steps.operations.outcome != 'skipped' }}
        id: redaction
        run: |
          python3 candidate/scripts/schema-values-latency.py --audit-only --records 64 \
            --output "$RUNNER_TEMP/lastsecrets-results"
      - name: Retain source revisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lastsecrets-revisions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lastsecrets-revisions/
          if-no-files-found: error
          retention-days: 14
      - name: Retain raw measurement samples and source identities
        if: ${{ always() && steps.redaction.outcome == 'success' }}
        id: measurements
        uses: actions/upload-artifact@v4
        with:
          name: lastsecrets-values-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lastsecrets-results/
          if-no-files-found: error
          retention-days: 14
      - name: Verify measurement archive identity, expiry, and checksum
        if: ${{ always() && steps.measurements.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.measurements.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.measurements.outputs.artifact-url }}
          ARTIFACT_SHA256: ${{ steps.measurements.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/measurement-metadata.json"
          python3 lastdb/scripts/benchmarks/artifact.py \
            --metadata "$RUNNER_TEMP/measurement-metadata.json" --output "$RUNNER_TEMP/measurement-receipt"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/measurement.zip"
          printf '%s  %s\n' "${ARTIFACT_SHA256#sha256:}" "$RUNNER_TEMP/measurement.zip" | sha256sum --check
          unzip -t "$RUNNER_TEMP/measurement.zip" > /dev/null
  benchmark-complete:
    if: ${{ always() }}
    needs: [compare]
    runs-on: ubuntu-24.04
    steps:
      - name: Require operations, measurements, and verified output
        env:
          RESULT: ${{ needs.compare.result }}
        run: test "$RESULT" = success
