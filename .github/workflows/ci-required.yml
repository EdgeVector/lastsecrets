# Gate of record for EdgeVector/lastsecrets (GitHub).
#
# `ci-required` is the branch-protection check. It runs .lastgit/ci.sh
# (shell syntax, frozen install, typecheck, per-file bun build).
# `registry-commit` runs on a push to main after the gate is green.
name: ci-required

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-required-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Merge gate (.lastgit/ci.sh)
        env:
          NO_COLOR: "1"
        run: bash .lastgit/ci.sh

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [gate]
    runs-on: ubuntu-24.04
    steps:
      - name: Every needed job succeeded
        env:
          RESULT: ${{ needs.gate.result }}
        run: test "$RESULT" = success

  registry-commit:
    name: Registry commit identity
    needs: [ci-required]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/registry-commit.py
